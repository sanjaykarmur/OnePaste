<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Online Clipboard lets you quickly share text between devices using a simple 4 digit code."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>OnePaste</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f6f7f9;

            color: #171717;

            -webkit-font-smoothing: antialiased;
        }


        /* =========================
           LAYOUT
           ========================= */

        .container {
            width: 100%;
            max-width: 620px;

            margin: 0 auto;

            padding:
                34px
                18px
                30px;
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            text-align: center;

            margin-bottom: 28px;
        }

        .logo {
            width: 62px;
            height: 62px;

            margin:
                0
                auto
                16px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #ffffff;

            font-size: 29px;

            box-shadow:
                0 8px 28px
                rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin: 0;

            font-size: 30px;

            line-height: 1.2;

            letter-spacing: -0.5px;
        }

        .subtitle {
            margin:
                9px
                auto
                0;

            max-width: 430px;

            color: #737373;

            font-size: 15px;

            line-height: 1.5;
        }


        /* =========================
           CARD
           ========================= */

        .card {
            background: #ffffff;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 18px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.055);
        }

        .card-title {
            margin:
                0
                0
                15px;

            font-size: 19px;

            font-weight: 650;
        }


        /* =========================
           TEXT AREA
           ========================= */

        .text-area {
            width: 100%;

            min-height: 210px;

            padding: 15px;

            border:
                1px solid
                #d9d9d9;

            border-radius: 13px;

            outline: none;

            resize: vertical;

            background: #ffffff;

            color: #171717;

            font-family:
                inherit;

            font-size: 16px;

            line-height: 1.55;

            transition:
                border-color
                0.15s ease,
                box-shadow
                0.15s ease;
        }

        .text-area::placeholder {
            color: #a0a0a0;
        }

        .text-area:focus {
            border-color: #555555;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.05);
        }


        /* =========================
           CHARACTER COUNT
           ========================= */

        .text-info {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 7px;

            min-height: 18px;

            color: #888888;

            font-size: 12px;
        }


        /* =========================
           BUTTON
           ========================= */

        .primary-button {
            width: 100%;

            min-height: 50px;

            margin-top: 14px;

            padding:
                13px
                16px;

            border: 0;

            border-radius: 12px;

            background: #171717;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                opacity
                0.15s ease,
                transform
                0.1s ease;
        }

        .primary-button:hover {
            opacity: 0.88;
        }

        .primary-button:active {
            transform: scale(0.99);
        }

        .primary-button:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           STATUS MESSAGE
           ========================= */

        .message {
            display: none;

            margin-top: 13px;

            padding:
                11px
                13px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            line-height: 1.4;
        }

        .message.error {
            display: block;

            background: #fff1f1;

            color: #bd2525;
        }

        .message.success {
            display: block;

            background: #edf9f1;

            color: #19733a;
        }


        /* =========================
           SENT CODE
           ========================= */

        .sent-box {
            display: none;

            margin-top: 18px;

            padding:
                18px
                15px;

            border-radius: 14px;

            background: #f5f5f5;

            text-align: center;
        }

        .sent-status {
            margin: 0;

            color: #19733a;

            font-size: 15px;

            font-weight: 600;
        }

        .code-label {
            margin:
                15px
                0
                5px;

            color: #707070;

            font-size: 13px;
        }

        .code {
            margin-left: 8px;

            font-size: 42px;

            line-height: 1.1;

            font-weight: 750;

            letter-spacing: 9px;

            font-variant-numeric:
                tabular-nums;
        }

        .expiry {
            margin:
                9px
                0
                0;

            color: #777777;

            font-size: 12px;
        }


        /* =========================
           DIVIDER
           ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 13px;

            margin:
                24px
                0;

            color: #999999;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.5px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #dddddd;
        }


        /* =========================
           CODE INPUT
           ========================= */

        .code-input {
            width: 100%;

            height: 60px;

            padding:
                8px
                14px
                8px
                22px;

            border:
                1px solid
                #d9d9d9;

            border-radius: 13px;

            outline: none;

            background: #ffffff;

            color: #171717;

            text-align: center;

            font-size: 26px;

            font-weight: 600;

            letter-spacing: 10px;

            font-variant-numeric:
                tabular-nums;

            transition:
                border-color
                0.15s ease,
                box-shadow
                0.15s ease;
        }

        .code-input::placeholder {
            color: #b0b0b0;

            font-weight: 400;
        }

        .code-input:focus {
            border-color: #555555;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.05);
        }


        /* =========================
           RECEIVED CONTENT
           ========================= */

        .received-box {
            display: none;

            margin-top: 18px;
        }

        .received-text {
            width: 100%;

            min-height: 220px;

            padding: 15px;

            border:
                1px solid
                #dddddd;

            border-radius: 13px;

            resize: vertical;

            outline: none;

            background: #fafafa;

            color: #222222;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* =========================
           COPY BUTTON
           ========================= */

        .copy-button {
            width: 100%;

            min-height: 48px;

            margin-top: 10px;

            border:
                1px solid
                #d5d5d5;

            border-radius: 11px;

            background: #ffffff;

            color: #171717;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background
                0.15s ease;
        }

        .copy-button:hover {
            background: #f5f5f5;
        }


        /* =========================
           FOOTER
           ========================= */

        footer {
            padding-top: 5px;

            text-align: center;

            color: #999999;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 480px) {

            .container {
                padding:
                    25px
                    14px
                    25px;
            }

            h1 {
                font-size: 27px;
            }

            .card {
                padding: 18px;
            }

            .text-area {
                min-height: 190px;
            }

            .code {
                font-size: 37px;
            }

        }

    </style>
</head>


<body>

    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <h1 style="color:darkred;">
                OnePaste
            </h1>

            <p class="subtitle">
                Send text between devices.
            </p>

        </header>


        <!-- SEND -->

        <section
            class="card"
            aria-labelledby="sendTitle"
        >

            <h2
                class="card-title"
                id="sendTitle"
            >
                Send Text
            </h2>


            <textarea
                class="text-area"
                id="sendText"
                maxlength="50000"
                placeholder="Type or paste your text here..."
                aria-label="Text to send"
            ></textarea>


            <div class="text-info">

                <span><b style="color:red;">
                    Text Only!       
                </b>    
                </span>

                <span id="characterCount">
                    0 / 50,000 characters
                </span>

            </div>


            <button
                class="primary-button"
                id="sendButton"
                type="button"
            >
                Send
            </button>


            <div
                class="message"
                id="sendMessage"
                role="status"
                aria-live="polite"
            ></div>


            <!-- SUCCESS CODE -->

            <div
                class="sent-box"
                id="sentBox"
            >

                <p class="sent-status">
                    Sent!
                </p>

                <p class="code-label">
                    Your 4 digit code
                </p>

                <div
                    class="code"
                    id="generatedCode"
                    aria-label="Generated code"
                >
                    0000
                </div>

                <p class="expiry">
                    The code will expire automatically.
                </p>

            </div>

        </section>


        <!-- DIVIDER -->

        <div
            class="divider"
            aria-hidden="true"
        >
            OR
        </div>


        <!-- RECEIVE -->

        <section
            class="card"
            aria-labelledby="receiveTitle"
        >

            <h2
                class="card-title"
                id="receiveTitle"
            >
                Receive Text
            </h2>


            <input
                class="code-input"
                id="receiveCode"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{4}"
                maxlength="4"
                autocomplete="one-time-code"
                placeholder="0000"
                aria-label="4 digit access code"
            >


            <button
                class="primary-button"
                id="receiveButton"
                type="button"
            >
                Get Text
            </button>


            <div
                class="message"
                id="receiveMessage"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- RECEIVED TEXT -->

            <div
                class="received-box"
                id="receivedBox"
            >

                <textarea
                    class="received-text"
                    id="receivedText"
                    readonly
                    aria-label="Received text"
                ></textarea>


                <button
                    class="copy-button"
                    id="copyButton"
                    type="button"
                >
                    Copy Text
                </button>

            </div>

        </section>


        <footer>
            No account required.
        </footer>

    </main>


    <script>

        /*
         * ==========================================
         * ONLINE CLIPBOARD
         * ==========================================
         *
         * Frontend version.
         *
         * Current temporary storage:
         * localStorage
         *
         * Production:
         * Replace the two storage operations with
         * Supabase API requests.
         *
         * ==========================================
         */


        const MAX_LENGTH = 50000;


        const sendText =
            document.getElementById(
                "sendText"
            );

        const characterCount =
            document.getElementById(
                "characterCount"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const sendMessage =
            document.getElementById(
                "sendMessage"
            );

        const sentBox =
            document.getElementById(
                "sentBox"
            );

        const generatedCode =
            document.getElementById(
                "generatedCode"
            );


        const receiveCode =
            document.getElementById(
                "receiveCode"
            );

        const receiveButton =
            document.getElementById(
                "receiveButton"
            );

        const receiveMessage =
            document.getElementById(
                "receiveMessage"
            );

        const receivedBox =
            document.getElementById(
                "receivedBox"
            );

        const receivedText =
            document.getElementById(
                "receivedText"
            );

        const copyButton =
            document.getElementById(
                "copyButton"
            );


        /*
         * ==========================================
         * CHARACTER COUNT
         * ==========================================
         */

        sendText.addEventListener(
            "input",
            () => {

                const count =
                    sendText.value.length;

                characterCount.textContent =
                    count.toLocaleString()
                    + " / "
                    + MAX_LENGTH.toLocaleString()
                    + " characters";

            }
        );


        /*
         * ==========================================
         * MESSAGE HELPER
         * ==========================================
         */

        function showMessage(
            element,
            text,
            type
        ) {

            element.textContent =
                text;

            element.className =
                "message " + type;

        }


        function clearMessage(element) {

            element.textContent =
                "";

            element.className =
                "message";

        }


        /*
         * ==========================================
         * GENERATE CODE
         * ==========================================
         */

        function generateCode() {

            return String(
                Math.floor(
                    1000 +
                    Math.random() * 9000
                )
            );

        }


        /*
         * ==========================================
         * SEND TEXT
         * ==========================================
         */

        sendButton.addEventListener(
            "click",
            () => {

                clearMessage(
                    sendMessage
                );


                const text =
                    sendText.value;


                if (!text.trim()) {

                    showMessage(
                        sendMessage,
                        "Please write something first.",
                        "error"
                    );

                    sendText.focus();

                    return;

                }


                if (
                    text.length >
                    MAX_LENGTH
                ) {

                    showMessage(
                        sendMessage,
                        "Text is too long.",
                        "error"
                    );

                    return;

                }


                /*
                 * TEMPORARY LOCAL STORAGE
                 *
                 * Replace this with the
                 * Supabase INSERT operation.
                 */

                const code =
                    generateCode();


                localStorage.setItem(
                    "clipboard_" + code,
                    text
                );


                generatedCode.textContent =
                    code;


                sentBox.style.display =
                    "block";


                showMessage(
                    sendMessage,
                    "Text sent successfully.",
                    "success"
                );

            }
        );


        /*
         * ==========================================
         * CODE INPUT
         * ==========================================
         */

        receiveCode.addEventListener(
            "
