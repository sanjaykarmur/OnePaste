<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="OnePaste lets you quickly share text between devices using a simple 4 digit code."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>OnePaste</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">

            <h1>OnePaste</h1>

            <p class="subtitle">
                Send text between devices.
            </p>

        </header>


        <!-- SEND -->

        <section class="card">

            <h2 class="card-title">
                Send Text
            </h2>

            <textarea
                class="text-area"
                id="sendText"
                maxlength="50000"
                placeholder="Type or paste your text here..."
                aria-label="Text to send"
            ></textarea>

            <div class="text-info">

                <span class="text-only">
                    Text Only!
                </span>

                <span id="characterCount">
                    0 / 50,000 characters
                </span>

            </div>

            <button
                class="primary-button"
                id="sendButton"
                type="button"
            >
                Send
            </button>

            <div
                class="message"
                id="sendMessage"
                role="status"
                aria-live="polite"
            ></div>


            <!-- SENT -->

            <div
                class="sent-box"
                id="sentBox"
            >

                <p class="sent-status">
                    Sent!
                </p>

                <p class="code-label">
                    Your 4 digit code
                </p>

                <div
                    class="code"
                    id="generatedCode"
                >
                    0000
                </div>

                <p class="expiry">
                    The code will expire automatically.
                </p>

            </div>

        </section>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- RECEIVE -->

        <section class="card">

            <h2 class="card-title">
                Receive Text
            </h2>

            <input
                class="code-input"
                id="receiveCode"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{4}"
                maxlength="4"
                placeholder="0000"
                autocomplete="off"
                aria-label="4 digit access code"
            >

            <button
                class="primary-button"
                id="receiveButton"
                type="button"
            >
                Get Text
            </button>

            <div
                class="message"
                id="receiveMessage"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- RECEIVED TEXT -->

            <div
                class="received-box"
                id="receivedBox"
            >

                <textarea
                    class="received-text"
                    id="receivedText"
                    readonly
                    aria-label="Received text"
                ></textarea>

                <button
                    class="copy-button"
                    id="copyButton"
                    type="button"
                >
                    Copy Text
                </button>

            </div>

        </section>


        <footer>
            No account required.
            <br>
            V 0.3
        </footer>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>

</html>
